spring.application.name=AntarStore

# ---------------------------------------------------------------------------
# All secrets below are read from environment variables. Nothing sensitive is
# committed to source control. Set these in your shell, a local .env loaded by
# your run configuration, or your deployment platform's secret manager.
#   DB_USERNAME, DB_PASSWORD          - MySQL credentials
#   MAIL_USERNAME, MAIL_PASSWORD      - SMTP / Gmail app password for OTP mail
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET - Razorpay API credentials (use
#                                       rzp_test_... keys while developing)
# See .env.example in the project root.
# ---------------------------------------------------------------------------

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/antarstore_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

server.port=8383

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Email configuration (OTP delivery)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Payment gateway (Razorpay) - never hardcode these in Java source
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
