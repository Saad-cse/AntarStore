<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
 
 <body>
        <div class="container-fluid">
          <div class="row  min-vh-100">
             <div class="col-md-7 text-login p-5 rounded-start banner " style="background-image: url('images/photo.png'); opacity: 0.9;">
                
                  
                 <h1 style="color: white; font-family:poppins; font-size:200px;">Antar</h1>
                 <h3 style="color:white; font-size: 100px; font-family: poppins;">Login Page </h3>
                                
             </div>
              <div class="col-md-5 pt-5  " style="padding:50px;margin-top: 100px;">
                 <div class="card shadow ">
                   <div class="card-header bg-dark">
                       <h2 class="text-center text-white pt-2">Login Here</h2>
                   </div>
                   <div class="card-body">
                       <form action="/Login" method="post">
                             <div class="mt-3 px-3">
                             
                                <label>Enter your email</label>
                                <input name="email" type="email" required class="form-control mt-2" placeholder="Enter Email...">
                             </div>
                             <div class="mt-3 px-3">
                                <label>Enter password</label>
                                <input name="password" type="password" required class="form-control mt-2" placeholder="Enter password....">
                             </div>
                             <div class="mt-4 text-center">
                                 <button type="submit" class="btn btn-dark">Login</button>
                                 <a href="/Register" type="button" class="btn btn-dark px-4 mx">Register</a>
                             </div>
                       </form>
                   </div>
                 </div>
              </div>
          </div>
       </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script >
         var msg ="[[${msg}]]";
         if(msg!=""){
        	 alert(msg);
         }
    </script>
   
  </body>
</html>
