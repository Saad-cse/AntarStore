<html th:replace="~{base::Layout(~{::main})}">
<body>
<main>
    <div class="antar-auth-wrap">

        <div class="antar-auth-image" th:style="'background-image:url(' + @{/images/story.png} + ')'">
            <div class="antar-auth-image-caption">
                <div class="eyebrow">AntarStore</div>
                <h2>Welcome Back</h2>
                <p>Sign in to pick up where you left off — your cart, your wishlist, and your orders are waiting.</p>
            </div>
        </div>

        <div class="antar-auth-panel">
            <div class="antar-auth-card">

                <div class="eyebrow">AntarStore</div>
                <h1>Sign In</h1>
                <p class="antar-auth-sub">Enter your details to access your account.</p>

                <div class="antar-auth-tabs">
                    <a href="/Login" class="active">Sign In</a>
                    <a href="/Register">Register</a>
                </div>

                <div class="antar-alert" th:if="${msg != null and msg != ''}" th:text="${msg}"></div>

                <form action="/Login" method="post">

                    <div class="antar-field">
                        <label>Email Address</label>
                        <input name="email" type="email" required placeholder="you@example.com">
                    </div>

                    <div class="antar-field antar-field-pass">
                        <label>Password</label>
                        <input name="password" type="password" id="login-password" required placeholder="Your password">
                        <button type="button" id="login-pass-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="antar-auth-submit">Sign In</button>

                </form>

                <p class="text-center mt-4" style="font-size:13.5px;">
                    New to AntarStore? <a th:href="@{/Register}">Create an account</a>
                </p>

            </div>
        </div>

    </div>
</main>
<script>
    (function(){
        var btn = document.getElementById('login-pass-toggle');
        var input = document.getElementById('login-password');
        if (btn && input) {
            btn.addEventListener('click', function(){
                var isPass = input.type === 'password';
                input.type = isPass ? 'text' : 'password';
                btn.innerHTML = isPass ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
            });
        }
    })();
</script>
</body>
</html>
