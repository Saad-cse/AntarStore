<html th:replace="~{base::Layout(~{::main})}">
<body>
<main>
    <div class="antar-auth-wrap">

        <div class="antar-auth-image" th:style="'background-image:url(' + @{/images/top.png} + ')'">
            <div class="antar-auth-image-caption">
                <div class="eyebrow">AntarStore</div>
                <h2>Almost There</h2>
                <p>One more step — verify your email and your account is ready to go.</p>
            </div>
        </div>

        <div class="antar-auth-panel">
            <div class="antar-auth-card">

                <div class="eyebrow">AntarStore</div>
                <h1>Verify Your Email</h1>
                <p class="antar-auth-sub">
                    We've sent a 6-digit code to your email address. Enter it below to activate your account.
                </p>

                <div class="antar-alert" th:if="${msg != null and msg != ''}" th:text="${msg}"></div>

                <form action="/verify-otp" method="post">

                    <div class="antar-field">
                        <label>One-Time Password</label>
                        <input name="otp" type="text" inputmode="numeric" maxlength="6"
                               autocomplete="one-time-code" required placeholder="Enter 6-digit code"
                               class="antar-otp-input">
                    </div>

                    <button type="submit" class="antar-auth-submit">Verify OTP</button>

                </form>

                <p class="text-center mt-4" style="font-size:13.5px;">
                    Didn't get a code? <a th:href="@{/resend-otp}">Resend OTP</a>
                </p>

            </div>
        </div>

    </div>
</main>
</body>
</html>
