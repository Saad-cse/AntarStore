<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
     <div class="container-fluid">
         <div class="row align-items-center" style="height:100vh; ">
             <div class="col-md-6 mx-auto">
               <div class="card shadow p-4">
                   <h3 style="font-family: new times roman;">Verify otp here...</h3>
                   <form action="/verify-otp" method="post">
                      <label>Enter otp</label>
                      <input name="otp"  type="text" class="form-control rounded-0 mt-2" placeholder="otp">
                      <div class="mt-4 text-center">
                         <button type="submit" class="btn btn-warning">Verify Otp</button>
                      </div>
                   </form>
                   <a href="/resend-otp">Resend Otp</a>
               </div>
            </div>
         
         </div>
     </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script >
        var msg = "[[${msg}]]";
        if(msg!=""){
        	alert(msg);
        }
    </script>
  </body>
</html>
