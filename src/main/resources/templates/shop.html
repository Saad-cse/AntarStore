<html th:replace="~{base::Layout(~{::main})}">
<body>

<main>
    <div class="container-fluid mt-5">

        <!-- Heading -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="fw-bold" th:if="${q == null or q == ''}">Shop Our Collection</h2>
                <h2 class="fw-bold" th:unless="${q == null or q == ''}">Search results for "<span th:text="${q}"></span>"</h2>
                <p class="text-muted" th:if="${q == null or q == ''}">
                    Shop our premium collection from AntarStore
                </p>
            </div>
        </div>

        <div class="row">

            <!-- Sidebar -->
            <div class="col-lg-3 mb-4">

                <div class="card">

                    <div class="card-header fw-bold">
                        Shop By Category
                    </div>

                    <div class="list-group list-group-flush">

                        <a href="/shop"
                           class="list-group-item list-group-item-action">
                            All Products
                        </a>

                        <a th:each="cate : ${categories}"
                           th:href="@{/shop(id=${cate.id})}"
                           class="list-group-item list-group-item-action d-flex align-items-center">

                            <span th:utext="${cate.categoryIcon}" class="me-2"></span>

                            <span th:text="${cate.categoryName}"></span>

                        </a>

                    </div>

                </div>

            </div>

            <!-- Product Section -->
            <div class="col-lg-9">

                <!-- Search -->
                <div class="row mb-3">
                    <div class="col-md-12 text-end mt-3 mt-md-0">

                        <h6>
                            Total Products :
                            <span class="badge antar-badge-ink"
                                  th:text="${products.size()}"></span>
                        </h6>

                    </div>

                </div>

                <!-- Products -->
                <div class="row">

                    <div class="col-lg-4 col-md-6 mb-4"
                         th:each="product : ${products}">

                        <div class="card h-100">

                            <!-- Product Image -->
                            <img class="card-img-top border border-1"
                                 th:src="@{'/ProductImages/'+${product.productImages.get(0)}}"
                                 alt="Product">

                            <div class="card-body d-flex flex-column">

                                <!-- Discount -->
                                <span class="badge antar-badge-wine align-self-start mb-2"
                                      th:text="${product.discount+'% OFF'}">
                                </span>

                                <!-- Name -->
                                <h5 class="card-title"
                                    th:text="${product.productName}">
                                </h5>

                                <!-- Brand -->
                                <p class="mb-1">
                                    <strong>Brand :</strong>
                                    <span th:text="${product.brandName}"></span>
                                </p>
								 <!-- Price -->
                                <h5 class="text-success">

                                    ₹<span th:text="${product.finalprice}"></span>

                                    <small class="text-decoration-line-through text-muted">

                                        ₹<span th:text="${product.sellingPrice}"></span>

                                    </small>

                                </h5>

                               
                                <!-- Status -->
                                <div class="mb-3">

                                    <span class="badge bg-success"
                                          th:if="${product.status.name()=='Available'}">
                                        In Stock
                                    </span>

                                    <span class="badge bg-danger"
                                          th:unless="${product.status.name()=='Available'}">
                                        Out Of Stock
                                    </span>

                                </div>

                                <!-- Button -->
                                <a th:href="@{'/Product/'+${product.id}}"
                                   class="btn btn-primary mt-auto">

                                    View Product
 	
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- No Products -->
                <div class="text-center py-5"
                     th:if="${#lists.isEmpty(products)}">

                    <h4>No Products Available</h4>

                </div>

            </div>

        </div>

    </div>
</main>

</body>
</html>
