<html th:replace="~{Admin/Adminbase::layout(~{::main})}">
<body>
    <main>

		<div class="container-fluid">
			<div class="row justify-content-center">
				<div class="col-lg-11">

					<div class="card shadow-sm border-0">
						<div class="card-header bg-primary text-white">
							<div class="d-flex justify-content-between align-items-center">
								<div>
									<h3 class="mb-0">Add New Product</h3>
									<small>Create a new product for your store.</small>
								</div>
								<a href="#" class="btn btn-light btn-sm"> <i
									class="bi bi-arrow-left"></i> Back
								</a>
							</div>
						</div>

						<div class="card-body">

							<form method="post" enctype="multipart/form-data" th:object="${dto}">

								<!-- Product Details -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Product Details</h5>
									</div>

									<div class="card-body">
										<div class="row g-3">

											<div class="col-md-6 mt-3">
												<label class="form-label">Product Name</label> 
												<input
													type="text" class="form-control" name="productName"
													placeholder="Enter product name" required>
											</div>

											<div class="col-md-6 mt-3">
												<label class="form-label">Brand Name</label> <input
													type="text" class="form-control" name="brandName"
													placeholder="Brand name">
											</div>

											<div class="col-md-6 mt-3">
												<label class="form-label">Category</label> <select
													class="form-control" name="category" required>
													<option selected disabled>Select Category</option>
													<option th:each="cate :${categories}" th:value="${cate.id}" th:text="${cate.categoryName}"></option>
													
												</select>
											</div>

											<div class="col-md-6 mt-3">
												<label class="form-label">Gender</label> <select
													class="form-control" name="gender" required>
													<option selected disabled>Select Gender</option>
													<option>men</option>
													<option>women</option>
													<option>kids</option>
													<option>unisex</option>
													
													
												</select>
											</div>

											<div class="col-12 mt-3">
												<label class="form-label">Product Description</label>
												<textarea class="form-control" rows="5"
													name="productDescription"
													placeholder="Write product description" required></textarea>
											</div>

										</div>
									</div>
								</div>

								<!-- Pricing -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Pricing Details</h5>
									</div>

									<div class="card-body">

										<div class="row g-3">

											<div class="col-md-3">
												<label class="form-label">Cost Price</label> <input
													type="number" step="0.01" class="form-control"
													name="costPrice" placeholder="0.0" required>
											</div>

											<div class="col-md-3">
												<label class="form-label">Selling Price</label> <input
													type="number" step="0.01" class="form-control"
													name="sellingPrice" placeholder="0.0" required id="sellingPrice">
											</div>

											<div class="col-md-3">
												<label class="form-label">Discount (%)</label> <input
													type="number" class="form-control" placeholder="0" name="discount" required id="discount">
											</div>

											<div class="col-md-3">
												<label class="form-label">Final Price</label> <input
													type="number" step="0.01" class="form-control"
													 placeholder="0.0" id="finalPrice" readonly>
											</div>

										</div>

									</div>
								</div>

								<!-- Variants -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Product Variants</h5>
									</div>

									<div class="card-body">

										<div class="row g-3">

											<div class="col-md-6">
												<label class="form-label">Available Colors</label> <input
													type="text" class="form-control" name="colors"
													placeholder="Black, White, Blue" required>
											</div>

											<div class="col-md-6">
												<label class="form-label">Available Sizes</label> <input
													type="text" class="form-control" name="sizes"
													placeholder="S, M, L, XL" required>
											</div>

										</div>

									</div>
								</div>

								<!-- Inventory -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Inventory & Shipping</h5>
									</div>

									<div class="card-body">

										<div class="row g-3">

											<div class="col-md-4">
												<label class="form-label">Quantity</label> <input
													type="number" class="form-control" placeholder="0" name="quantity" required>
											</div>

											<div class="col-md-4">
												<label class="form-label">Shipping Charge</label> <input
													type="number" step="0.01" class="form-control"
													name="shippingCharge" placeholder="0.0">
											</div>

											<div class="col-md-4">
												<label class="form-label">Delivery Time</label> <input
													type="text" class="form-control" name="deliveryTime"
													placeholder="2-5 Days">
											</div>

										</div>

									</div>
								</div>

								<!-- Images -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Product Images</h5>
									</div>

									<div class="card-body">

										<div class="mb-3">
											<label class="form-label"> Upload Product Images </label> <input
												type="file" accept=".png,.jpg,.jpeg,.webp" class="form-control" multiple name="images" required>
											<div class="form-text">You can upload multiple product
												images.</div>
										</div>

									</div>
								</div>

								<!-- Settings -->
								<div class="card mb-4">
									<div class="card-header">
										<h5 class="mb-0">Product Settings</h5>
									</div>

									<div class="card-body">

										<div class="row">

											  <div class="col-md-6">

												<div class="form-check form-switch mb-3 d-flex">
													<label class="form-check-label">
														<input class="form-check-input task-select" type="checkbox" checked>
														<span class="form-check-sign"></span>
													</label>
													<label class="form-label d-block"> Product Visible </label>
												</div>

											</div>

											<div class="col-md-6">

												<div class="form-check form-switch mb-3">
													<label class="form-check-label">
														<input class="form-check-input task-select" type="checkbox" name="returnPolicy"> 
														<span class="form-check-sign"></span>
													</label>
													<label class="form-label"> Return Policy Available</label>
												</div>

											</div>

										</div>

									</div>
								</div>

								<!-- Buttons -->
								<div class="d-flex justify-content-end gap-2">

									<button type="reset" class="btn btn-outline-secondary mx-2">
										Reset</button>

									<button type="submit" class="btn btn-primary">Save
										Product</button>

								</div>

							</form>

						</div>
					</div>

				</div>
			</div>
		</div>
        <script >
           var discount =document.getElementById("discount");
           var sellingPrice = document.getElementById("sellingPrice");
           var finalPrice = document.getElementById("finalPrice");
           
           discount.addEventListener('keyup',()=>{
        	   finalPrice.value = sellingPrice.value-sellingPrice.value *( discount.value/100);
           });
        </script>
	</main>

</body>
</html>
