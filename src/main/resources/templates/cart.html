<html th:replace="~{base::Layout(~{::main})}">

<body>

<main>

<section class="vct-page py-5">

<div class="container">

    <!-- Page Header -->

    <div class="mb-5">

        <h2 class="vct-page-title">
            <i class="bi bi-cart3 me-2"></i>
            Shopping Cart
        </h2>

        <p class="text-muted">
            <span th:text="${cartItems.size()}"></span> Item(s) in your cart
        </p>

    </div>

    <div class="row g-4">

        <!-- ================= LEFT ================= -->

        <div class="col-lg-8">

            <div th:if="${#lists.isEmpty(cartItems)}">

                <div class="vct-empty-box text-center">

                    <i class="bi bi-cart-x display-2"></i>

                    <h3 class="mt-3">
                        Your Cart is Empty
                    </h3>

                    <a th:href="@{/shop}"
                       class="btn btn-warning mt-3">

                        Continue Shopping

                    </a>

                </div>

            </div>

            <!-- Cart Items -->

            <div class="vct-cart-card mb-4"
                 th:each="cart : ${cartItems}">

                <div class="row align-items-center">

                    <!-- Image -->

                    <div class="col-md-3">

                        <img class="img-fluid rounded"

                             th:src="@{'/ProductImages/'+${cart.product.productImages.get(0)}}">

                    </div>

                    <!-- Details -->

                    <div class="col-md-5">

                        <h4 th:text="${cart.product.productName}"></h4>

                        <p class="mb-1">

                            Brand :

                            <span th:text="${cart.product.brandName}"></span>

                        </p>

                        <p class="mb-1">

                            Color :

                            <span th:text="${cart.color}"></span>

                        </p>

                        <p>

                            Size :

                            <span th:text="${cart.size}"></span>

                        </p>

                        <h5 class="text-warning">

                            ₹<span th:text="${cart.productPrice}"></span>

                        </h5>

                    </div>

                    <!-- Quantity -->

                    <div class="col-md-2">

                        <div class="vct-qty-box">

                            <form th:action="@{'/cart/decrease/'+${cart.id}}"
                                  method="post">

                                <button class="btn btn-outline-light">

                                    -

                                </button>

                            </form>

                            <span class="mx-3"
                                  th:text="${cart.quantity}"></span>

                            <form th:action="@{'/cart/increase/'+${cart.id}}"
                                  method="post">

                                <button class="btn btn-outline-light">

                                    +

                                </button>

                            </form>

                        </div>

                    </div>

                    <!-- Remove -->

                    <div class="col-md-2 text-end">

                        <h5>

                            ₹<span th:text="${cart.finalPrice}"></span>

                        </h5>

                        <form th:action="@{'/cart/remove/'+${cart.id}}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm mt-3">
                                <i class="bi bi-trash"></i>
                                Remove
                            </button>
                        </form>

                    </div>

                </div>

            </div>

        </div>

        <!-- ================= RIGHT SIDEBAR ================= -->

        <div class="col-lg-4">

            <div class="vct-summary-box">

                <h3 class="mb-4">

                    Order Summary

                </h3>

                <div class="d-flex justify-content-between mb-3">

                    <span>Items</span>

                    <strong th:text="${cartItems.size()}"></strong>

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <span>Subtotal</span>

                    <strong>

                        ₹<span th:text="${subtotal}"></span>

                    </strong>

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <span>Shipping</span>

                    <strong>

                        ₹<span th:text="${shipping}"></span>

                    </strong>

                </div>

                <div class="d-flex justify-content-between mb-3" th:if="${discount > 0}">

                    <span>You Saved</span>

                    <strong class="text-success">

                        ₹<span th:text="${discount}"></span>

                    </strong>

                </div>

                <hr>

                <div class="d-flex justify-content-between">

                    <h4>Total</h4>

                    <h4 class="text-warning">

                        ₹<span th:text="${grandTotal}"></span>

                    </h4>

                </div>

                <div th:unless="${hasAddress}" class="alert alert-warning py-2 mt-3 mb-0">
                    <a href="/address">Add a delivery address</a> to proceed to payment.
                </div>

                <div class="d-grid mt-4">

					<button class="btn btn-warning btn-lg w-100" th:disabled="${!hasAddress or #lists.isEmpty(cartItems)}"
					        onclick="checkout()">
					    <i class="bi bi-credit-card"></i>
					    Proceed To Payment
					</button>

                </div>

                <div class="mt-4">

                    <small class="antar-trust-note">

                        ✔ Secure Checkout

                    </small>

                    <br>

                    <small class="antar-trust-note">

                        ✔ Fast Delivery

                    </small>

                    <br>

                    <small class="antar-trust-note">

                        ✔ Easy Returns

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

</section>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
	function checkout(){

	fetch("/payment/create")
	.then(r=>r.json())
	.then(data=>{

	if(data.error){
		if(data.error === "NO_ADDRESS"){
			alert(data.message);
			window.location = "/address";
		} else if(data.error === "NOT_LOGGED_IN"){
			window.location = "/Login";
		} else {
			alert(data.message || "Unable to start checkout.");
		}
		return;
	}

	new Razorpay({

	key:data.key,

	amount:data.amount,

	currency:"INR",

	order_id:data.orderId,

	name:"AntarStore",

	prefill:{
	name:data.name,
	email:data.email,
	contact:data.contact
	},

	handler:function(res){

	fetch("/payment/verify",{

	method:"POST",

	headers:{
	"Content-Type":"application/x-www-form-urlencoded"
	},

	body:new URLSearchParams({

	paymentId:res.razorpay_payment_id,
	orderId:res.razorpay_order_id,
	signature:res.razorpay_signature

	})

	})
	.then(r=>r.text())
	.then(result=>{

	if(result=="success"){
	
	alert("Payment Success, Order Confirmed");
	window.location="/MyOrders";

	}else{

	alert(result);

	}

	});

	}

	}).open();

	});

	}
</script>

</main>

</body>

</html>
