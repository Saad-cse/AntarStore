<html th:replace="~{base::Layout(~{::main})}">
<body>
<main>
    <div class="antar-auth-wrap">

        <div class="antar-auth-image" th:style="'background-image:url(' + @{/images/slider-hero.png} + ')'">
            <div class="antar-auth-image-caption">
                <div class="eyebrow">AntarStore</div>
                <h2>Join the Atelier</h2>
                <p>Create an account for a faster checkout, order tracking, and a wishlist that's always saved.</p>
            </div>
        </div>

        <div class="antar-auth-panel">
            <div class="antar-auth-card">

                <div class="eyebrow">AntarStore</div>
                <h1>Create Account</h1>
                <p class="antar-auth-sub">Register here to shop our premium collection.</p>

                <div class="antar-auth-tabs">
                    <a href="/Login">Sign In</a>
                    <a href="/Register" class="active">Register</a>
                </div>

                <div class="antar-alert" th:if="${msg != null and msg != ''}" th:text="${msg}"></div>

                <form action="/Register" method="post" th:object="${dto}">

                    <div class="antar-field">
                        <label>Full Name</label>
                        <input th:field="*{name}" type="text" required placeholder="Your full name">
                    </div>

                    <div class="antar-field">
                        <label>Mobile Number</label>
                        <input th:field="*{contactNo}" type="text" inputmode="numeric" required placeholder="10-digit mobile number">
                    </div>

                    <div class="antar-field">
                        <label>Email Address</label>
                        <input th:field="*{email}" type="email" required placeholder="you@example.com">
                    </div>

                    <div class="antar-field">
                        <label>Gender</label>
                        <select th:field="*{gender}">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="antar-field antar-field-pass">
                        <label>Password</label>
                        <input th:field="*{password}" type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 characters">
                        <button type="button" id="reg-pass-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                        <div class="antar-strength"><div class="antar-strength-bar" id="strength-bar"></div></div>
                    </div>

                    <button type="submit" class="antar-auth-submit">Register Account</button>

                </form>

                <p class="text-center mt-4" style="font-size:13.5px;">
                    Already have an account? <a th:href="@{/Login}">Sign in</a>
                </p>

            </div>
        </div>

    </div>
</main>
<script>
    (function(){
        var btn = document.getElementById('reg-pass-toggle');
        var input = document.getElementById('reg-password');
        if (btn && input) {
            btn.addEventListener('click', function(){
                var isPass = input.type === 'password';
                input.type = isPass ? 'text' : 'password';
                btn.innerHTML = isPass ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
            });
        }
        var bar = document.getElementById('strength-bar');
        if (input && bar) {
            input.addEventListener('input', function(){
                var v = input.value;
                var score = 0;
                if (v.length >= 6) score++;
                if (v.length >= 10) score++;
                if (/[A-Z]/.test(v)) score++;
                if (/[0-9]/.test(v)) score++;
                if (/[^A-Za-z0-9]/.test(v)) score++;
                var pct = Math.min(100, (score / 5) * 100);
                var color = score <= 1 ? '#c0392b' : score <= 3 ? '#d4a017' : '#2f8f4e';
                bar.style.width = pct + '%';
                bar.style.background = color;
            });
        }
    })();
</script>
</body>
</html>
